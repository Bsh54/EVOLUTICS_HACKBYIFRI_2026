name: Supabase Keep-Alive

on:
  schedule:
    # Ping tous les jours à 08h00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # permet aussi de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/opportunities?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Supabase response status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase est actif et répond correctement."
          else
            echo "❌ Supabase a retourné une erreur ($STATUS)."
            exit 1
          fi
